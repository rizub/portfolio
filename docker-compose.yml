name: ubai-portfolio

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ubai-portfolio-web
    restart: unless-stopped
    networks:
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.ubai-portfolio-http.rule=Host(`ubai.kreatekode.tech`)
      - traefik.http.routers.ubai-portfolio-http.entrypoints=web
      - traefik.http.routers.ubai-portfolio-http.middlewares=ubai-portfolio-https-redirect
      - traefik.http.middlewares.ubai-portfolio-https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.ubai-portfolio-https-redirect.redirectscheme.permanent=true
      - traefik.http.routers.ubai-portfolio.rule=Host(`ubai.kreatekode.tech`)
      - traefik.http.routers.ubai-portfolio.entrypoints=websecure
      - traefik.http.routers.ubai-portfolio.tls=true
      - traefik.http.routers.ubai-portfolio.tls.certresolver=letsencrypt
      - traefik.http.services.ubai-portfolio.loadbalancer.server.port=80
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  coolify:
    external: true
